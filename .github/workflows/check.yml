name: Checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'notebooks/**'
      - 'configs/**'
      - 'demo.py'
      - 'requirements-demo.txt'
      - 'pyproject.toml'
      - '.gitattributes'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'notebooks/**'
      - 'configs/**'
      - 'demo.py'
      - 'requirements-demo.txt'
      - 'pyproject.toml'
      - '.gitattributes'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      YOLO_CONFIG_DIR: /tmp/aerovision-ultralytics
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,demo]'
      - name: Unit and notebook integrity tests
        run: python -m pytest -q --tb=short
      - name: Lint
        run: python -m ruff check src tests --select E9,F63,F7,F82
