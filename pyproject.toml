[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerovision-lab"
version = "0.1.0"
description = "Small GPU experiments for aerial small-object detection"
requires-python = ">=3.11"
dependencies = ["ultralytics==8.3.228", "numpy>=1.26,<3", "Pillow>=10", "PyYAML>=6", "pycocotools>=2.0.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
aerovision = "aerovision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
