[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerovision-lab"
version = "1.1.0"
description = "Reproducible aerial object detection and CPU/browser deployment"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.11"
dependencies = ["ultralytics==8.3.228", "numpy>=1.26,<3", "Pillow>=10", "PyYAML>=6", "pycocotools>=2.0.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
export = ["onnx==1.18.0", "onnxruntime==1.22.1"]
demo = ["streamlit==1.50.0", "onnxruntime==1.22.1"]

[project.scripts]
aerovision = "aerovision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
